<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GovGate – Mobile Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 585px; /* match phone height for perfect centering */
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 5px;
      background: radial-gradient(ellipse at top, #1a1a2e 0%, #0d0d0d 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }


    .label {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ── Phone shell ── */
    .phone {
      position: relative;
      width: 320px;
      height: 585px;
      background: #1c1c1e;
      border-radius: 54px;
      box-shadow:
        0 0 0 1.5px #3a3a3c,
        0 0 0 3px #1c1c1e,
        0 0 0 4.5px #3a3a3c,
        0 50px 120px rgba(0,0,0,0.8),
        inset 0 0 0 1px rgba(255,255,255,0.06);
      /* scale down so it always fits the viewport */
      transform-origin: top center;
    }

    /* side buttons */
    .phone::before {
      content: '';
      position: absolute;
      right: -5px;
      top: 160px;
      width: 4px;
      height: 70px;
      background: #3a3a3c;
      border-radius: 0 3px 3px 0;
      box-shadow: 0 90px 0 #3a3a3c;
    }
    .phone::after {
      content: '';
      position: absolute;
      left: -5px;
      top: 120px;
      width: 4px;
      height: 40px;
      background: #3a3a3c;
      border-radius: 3px 0 0 3px;
      box-shadow: 0 58px 0 #3a3a3c, 0 112px 0 #3a3a3c;
    }

    /* screen bezel */
    .screen {
      position: absolute;
      inset: 10px;
      background: #000;
      border-radius: 46px;
      overflow: hidden;
    }

    /* dynamic island */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
    }

    /* the actual app */
    .app-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 46px;
    }

    /* home indicator */
    .home-bar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 5px;
      background: rgba(255,255,255,0.35);
      border-radius: 3px;
      z-index: 10;
      pointer-events: none;
    }

    /* ── Responsive scaling ── */
    
  </style>
</head>
<body>
  <div class="phone">
      <div class="screen">
        <iframe
          class="app-frame"
          src="web/index.html"
          title="GovGate App"
          allow="camera; microphone; notifications"
        ></iframe>
        <div class="home-bar"></div>
      </div>
    </div>
  
</body>
</html>
